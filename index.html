<style>
:root{--orange:#FF9900;--ink:#1A1A1A;--paper:#FFFFFF;--mist:#F4F2EF;--line:#E2DDD6;--text2:#5A5A5A;--crit:#B3261E}
@media (prefers-color-scheme:dark){:root{--ink:#F5F2EE;--paper:#171614;--mist:#201E1B;--line:#35322D;--text2:#A9A29A;--crit:#FF7A6E}}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--paper);font-family:Poppins,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);display:grid;grid-template-rows:auto 1fr}
header{background:#1A1A1A;color:#fff;padding:30px 16px} header .in{max-width:520px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
h1{font-family:"Nunito Sans",Poppins,sans-serif;font-weight:800;font-size:clamp(24px,5vw,32px);margin:6px 0 0;color:#fff}
main{display:grid;place-items:start center;padding:36px 16px}
form{width:100%;max-width:520px;background:var(--mist);border-radius:20px;padding:22px;display:grid;gap:12px}
label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text2)}
input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button{font:inherit;font-weight:600;font-size:15px;padding:12px 16px;border:0;border-radius:999px;background:#1A1A1A;color:var(--orange);cursor:pointer}
@media (prefers-color-scheme:dark){button{box-shadow:inset 0 0 0 1px rgba(255,153,0,.5)}}
.msg{font-size:13px;color:var(--crit);min-height:1.2em} .hint{font-size:12.5px;color:var(--text2)}
</style></head><body>
<header><div class="in"><p class="eyebrow">Roicos · Informe privado para Cafés Bou</p><h1>Bou. Informe Klaviyo</h1></div></header>
